<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Receipt Generator</title>

    <link rel="stylesheet"
        href="https://pyscript.net/releases/2026.7.3/core.css">

    <script type="module"
        src="https://pyscript.net/releases/2026.7.3/core.js">
    </script>

    <style>

        body {
            background-image: url('https://i.pinimg.com/1200x/e6/6e/c8/e66ec8fcaa5a6f47dce9f10e2b94318a.jpg');
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100;
            margin: 0;
            background-repeat: none;
        }

        .receipt {
            background-color: #ffb3bb;
            width: 400px;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgb(255, 220, 236);
        }

        .title {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            font-size: 40px;
        }

        .menu {
            background-color: #ffffff;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .menu h3 {
            color: #ff8c9d;
            margin-top: 0;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            color: #d69396;
        }

        .item input {
            margin-right: 8px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background-color: #ff9ecb;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .receipt-display {
            background-color: #f9edff;
            color: #6d4b65;
            min-height: 150px;
            border-radius: 12px;
            margin-top: 20px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 17px;
        }

        .receipt-display h3 {
            text-align: center;
            color: #8f5c85;
        }

        .total {
            font-weight: bold;
            font-size: 20px;
        }

    </style>

</head>

<body>

    <div class="receipt">

        <h2 class="title">Receipt of Love and Hearts Cafe</h2>

        <div class="menu">

            <h3>Choose Your Items</h3>

            <label class="item">
                <span>
                    <input type="checkbox" id="cake">
                    Love-lock Cheesecake
                </span>
                <span>₱180</span>
            </label>

            <label class="item">
                <span>
                    <input type="checkbox" id="donut">
                    Tongue-twister Sourdough Donut
                </span>
                <span>₱50</span>
            </label>

            <label class="item">
                <span>
                    <input type="checkbox" id="pizza">
                    The Romantic Cheezy Pizza
                </span>
                <span>₱220</span>
            </label>

            <label class="item">
                <span>
                    <input type="checkbox" id="cola">
                    Love-shot Cola
                </span>
                <span>₱100</span>
            </label>

            <label class="item">
                <span>
                    <input type="checkbox" id="icecream">
                    Soulmate Duo Ice Cream
                </span>
                <span>₱120</span>
            </label>

        </div>

        <button py-click="generate_receipt">
            Generate Receipt
        </button>

        <br><br>

        <div id="result" class="receipt-display">
            <h3>Your Receipt</h3>
            Select your items and click "Generate Receipt".
        </div>

    </div>

    <py-script src="main.py"></py-script>

</body>
</html>
